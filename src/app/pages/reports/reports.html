<div class="report__outer__div">
    <app-subheader [title]="title" />
    <app-utility 
        [width]="searchWidth" 
        [height]="searchHeight" 
        [addBtnTitle]="addBtnTitle"
        (searchChange)="onSearchChange($event)" 
        (sortChange)="onSortChange($event)"
    />
    <div class="table__outermost__div">
        <app-table 
            [columns]="columns" 
            [reports]="paginatedReports"
            (deleteReport)="deleteReport($event)"
        >
        </app-table>
    </div>
    <div class="reports__div__footer">
        <span>
            {{  totalReports === 0 ? 0 : startIndex + 1 }}-{{ endIndex }} of {{ totalReports }} History Records
        </span>

        <div class="reports__div__pagination">
            <button (click)="prevPage()" [disabled]="currentPage === 1">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button *ngFor="let page of pages" (click)="goToPage(page)" [class.active]="currentPage === page">
                {{ page }}
            </button>

            <button (click)="nextPage()" [disabled]="currentPage === totalPages">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>
</div>
